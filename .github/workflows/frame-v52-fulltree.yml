name: Final polish and frame Winter World V52 spruce

on:
  push:
    branches:
      - render-v52-cycles
    paths:
      - .github/workflows/frame-v52-fulltree.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: winterworld-v52-framed-fulltree
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out V52 source for final polish
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mesh rebuild dependencies
        run: python -m pip install --upgrade numpy scipy trimesh

      - name: Verify and extract naturalized source
        shell: bash
        run: |
          set -euo pipefail
          test -s render-v52-source.zip
          unzip -t render-v52-source.zip
          unzip -q render-v52-source.zip
          test -s render-v52-source/v52/build_hero_spruce_v52.py
          test -s render-v52-source/v52/render_cycles_v52.py

      - name: Seal branch-to-snow contact across every bough tier
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("render-v52-source/v52/build_hero_spruce_v52.py")
          s = path.read_text(encoding="utf-8")

          # Keep the approved six-root crown and primary collar polish reproducible.
          root_candidates = [
              s.find("    # Slightly exposed root flares"),
              s.find("    # Exposed root flares form"),
              s.find("    # Six exposed root flares blend"),
          ]
          root_candidates = [i for i in root_candidates if i >= 0]
          if not root_candidates:
              raise SystemExit("Could not find the V52 root-flare section.")
          root_start = min(root_candidates)
          root_end = s.index("    whorl_data=[]", root_start)
          new_root = "\n".join([
              "    # Six exposed root flares blend into the trunk and reach the forest floor.",
              "    for k in range(6):",
              "        a=k*math.tau/6+rng.uniform(-.16,.16)",
              "        dx,dz=math.cos(a),math.sin(a)",
              "        root_len=rng.uniform(.48,.72)",
              "        root=[np.array([0,.14,0]),",
              "              np.array([dx*root_len*.48,.025,dz*root_len*.48]),",
              "              np.array([dx*root_len,-.098,dz*root_len])]",
              "        trunk.add_tube(root,[.118,.061,.0075],'bark',8,seed+80+k,ridged=.10)",
              "",
          ]) + "\n"
          s = s[:root_start] + new_root + s[root_end:]

          old_bough = "            boughs.add_tube([p0,p1,p2,p3],[base_r,base_r*.70,base_r*.39,.0065],'twig',8,branch_seed,ridged=.025)"
          new_bough = "\n".join([
              "            # Gentle basal swelling gives the primary bough a more convincing",
              "            # collar where it emerges from the trunk; the taper remains gradual.",
              "            boughs.add_tube([p0,p1,p2,p3],",
              "                            [base_r*1.28,base_r*.84,base_r*.39,.0065],",
              "                            'twig',10,branch_seed,ridged=.022)",
          ])
          if old_bough in s:
              s = s.replace(old_bough, new_bough, 1)
          elif "Gentle basal swelling gives the primary bough" not in s or "[base_r*1.28,base_r*.84" not in s:
              raise SystemExit("Neither baseline nor polished primary-bough collar was found.")

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f"Missing source marker: {label}")
              s = s.replace(old, new, 1)

          old_sig = "    def add_snow_ribbon(self, points, half_width, thickness, lift, seed,\n                        segments=20, start=0.0, end=1.0):"
          new_sig = "    def add_snow_ribbon(self, points, half_width, thickness, lift, seed,\n                        segments=20, start=0.0, end=1.0, support_radii=None):"
          if old_sig in s:
              s = s.replace(old_sig, new_sig, 1)
          elif new_sig not in s:
              raise SystemExit("Could not identify add_snow_ribbon signature.")

          pts_line = "        pts=[np.asarray(p,dtype=float) for p in points]"
          radii_lines = "\n".join([
              pts_line,
              "        radius_values=np.asarray(support_radii,dtype=float) if support_radii is not None else None",
              "        if radius_values is not None and (radius_values.shape != (len(pts),) or np.any(radius_values <= 0)):",
              "            raise ValueError('support_radii must contain one positive radius for every ribbon path point')",
          ])
          if pts_line in s:
              s = s.replace(pts_line, radii_lines, 1)
          elif "radius_values=np.asarray(support_radii" not in s:
              raise SystemExit("Could not add the branch-radius support data.")

          tangent_line = "            f=np.clip((dist-cumulative[seg])/seg_len,0.0,1.0)"
          radius_block = "\n".join([
              tangent_line,
              "            support_radius=None",
              "            if radius_values is not None:",
              "                support_radius=float(radius_values[seg]*(1-f)+radius_values[seg+1]*f)",
          ])
          if tangent_line in s and "            support_radius=None" not in s:
              s = s.replace(tangent_line, radius_block, 1)
          elif "            support_radius=None" not in s:
              raise SystemExit("Could not add per-segment support-radius interpolation.")

          old_base = "            base_y=center[1]+lift+waviness"
          new_base = "\n".join([
              "            contact_lift=lift",
              "            if support_radius is not None:",
              "                # Embed the snow's lower edge slightly into the supporting wood.",
              "                # Clamp micro-relief to the local radius so thin tips cannot float.",
              "                contact_lift=min(lift,support_radius*.88)",
              "                waviness=float(np.clip(waviness,-support_radius*.04,support_radius*.04))",
              "            base_y=center[1]+contact_lift+waviness",
          ])
          if old_base in s:
              s = s.replace(old_base, new_base, 1)
          elif "contact_lift=min(lift,support_radius*.88)" not in s:
              raise SystemExit("Could not find snow-ribbon base-height calculation.")

          # Turn every ribbon into a closed cap: its hidden underside is embedded in
          # the branch, so camera angle and taper cannot expose a floating seam.
          fn_start = s.index("    def add_snow_ribbon(")
          fn_end = s.index("\n    def add_snow_clump(", fn_start)
          fn = s[fn_start:fn_end]
          # Align snow with the same perpendicular cross-section used by add_tube().
          old_frame = "\n".join([
              "            up=np.array([0.,1.,0.])",
              "            side=unit(np.cross(up,tangent))",
              "            if np.linalg.norm(side)<.15:",
              "                side=unit(np.cross(np.array([0.,0.,1.]),tangent))",
              "            if np.linalg.norm(side)<.15: side=np.array([1.,0.,0.])",
          ])
          new_frame = "\n".join([
              "            world_up=np.array([0.,1.,0.])",
              "            up=world_up-tangent*float(np.dot(world_up,tangent))",
              "            if np.linalg.norm(up)<.15:",
              "                world_ref=np.array([0.,0.,1.])",
              "                up=world_ref-tangent*float(np.dot(world_ref,tangent))",
              "            if np.linalg.norm(up)<.15:",
              "                world_ref=np.array([1.,0.,0.])",
              "                up=world_ref-tangent*float(np.dot(world_ref,tangent))",
              "            up=unit(up)",
              "            side=unit(np.cross(up,tangent))",
          ])
          if old_frame in fn:
              fn=fn.replace(old_frame,new_frame,1)
          elif "up=world_up-tangent*float(np.dot(world_up,tangent))" not in fn:
              raise SystemExit("Could not align snow's local frame to the branch tube frame.")

          # Follow the tube's circular upper arc at each lateral station and bury
          # the hidden underside just enough to eliminate a visible wood/snow seam.
          old_bed = "\n".join([
              "                bed_radius=support_radius if support_radius is not None else max(lift,thickness)",
              "                bottom_half=min(width*.72,bed_radius*.72)",
              "                bottom_y=center[1]+bed_radius*.35",
              "                bottom_p=center+up*(bottom_y-center[1])+side*(x*bottom_half)",
          ])
          new_bed = "\n".join([
              "                bed_radius=max(support_radius if support_radius is not None else max(lift,thickness),.0008)",
              "                bottom_half=min(width*.72,bed_radius*.97)",
              "                bottom_lateral=x*bottom_half",
              "                # Tube radius is circular in this local cross-section; follow its upper arc.",
              "                wood_cross_radius=bed_radius*1.04",
              "                wood_surface=math.sqrt(max(wood_cross_radius*wood_cross_radius-bottom_lateral*bottom_lateral,0.0))",
              "                embed_depth=max(.00016,bed_radius*.16)",
              "                bottom_offset=max(0.0,wood_surface-embed_depth)",
              "                bottom_y=center[1]+bottom_offset",
              "                bottom_p=center+up*(bottom_y-center[1])+side*bottom_lateral",
          ])
          if old_bed in fn:
              fn=fn.replace(old_bed,new_bed,1)
          elif "wood_cross_radius=bed_radius*.96" not in fn:
              raise SystemExit("Could not replace flat underside with tube-profile contact skin.")

          if "wood_cross_radius=bed_radius*.96" not in fn or "up=world_up-tangent*float(np.dot(world_up,tangent))" not in fn:
              raise SystemExit("Branch-aligned snow contact skin was not fully applied.")
          if "bottom_verts.append(bottom_p)" not in fn:
              old_top_lists = "        verts=[]; cols=[]"
              new_top_lists = "        verts=[]; cols=[]; bottom_verts=[]; bottom_cols=[]"
              if old_top_lists not in fn:
                  raise SystemExit("Could not add underside vertex buffers to add_snow_ribbon.")
              fn = fn.replace(old_top_lists, new_top_lists, 1)

              old_color_append = "                cols.append(np.clip(color,0,1))"
              bottom_code = "\n".join([
                  old_color_append,
                  "                # Hidden lower skin sits inside the supporting wood.",
                  "                bed_radius=support_radius if support_radius is not None else max(lift,thickness)",
                  "                bottom_half=min(width*.72,bed_radius*.72)",
                  "                bottom_y=center[1]+bed_radius*.35",
                  "                bottom_p=center+up*(bottom_y-center[1])+side*(x*bottom_half)",
                  "                bottom_verts.append(bottom_p)",
                  "                bottom_cols.append(np.clip(base_color*.90,0,1))",
              ])
              if old_color_append not in fn:
                  raise SystemExit("Could not add the embedded snow underside vertices.")
              fn = fn.replace(old_color_append, bottom_code, 1)

          if "cols_per_row=len(cross)" not in fn:
              face_start = fn.index("        base=len(self.v)\n")
              new_faces = "\n".join([
                  "        cols_per_row=len(cross)",
                  "        top_base=len(self.v)",
                  "        for p,c in zip(verts,cols): self.add_vertex(p,c)",
                  "        bottom_base=len(self.v)",
                  "        for p,c in zip(bottom_verts,bottom_cols): self.add_vertex(p,c)",
                  "        for i in range(segments):",
                  "            for j in range(cols_per_row-1):",
                  "                a=top_base+i*cols_per_row+j",
                  "                b=top_base+(i+1)*cols_per_row+j",
                  "                c=a+1; d=b+1",
                  "                self.f.extend([(a,b,c),(c,b,d)])",
                  "                ba=bottom_base+i*cols_per_row+j",
                  "                bb=bottom_base+(i+1)*cols_per_row+j",
                  "                bc=ba+1; bd=bb+1",
                  "                # Reverse winding: underside normal faces into the branch.",
                  "                self.f.extend([(ba,bc,bb),(bc,bd,bb)])",
                  "            # Close both feathered side edges of the mantle.",
                  "            ta=top_base+i*cols_per_row",
                  "            tb=top_base+(i+1)*cols_per_row",
                  "            ba=bottom_base+i*cols_per_row",
                  "            bb=bottom_base+(i+1)*cols_per_row",
                  "            self.f.extend([(ta,ba,tb),(tb,ba,bb)])",
                  "            j=cols_per_row-1",
                  "            ta=top_base+i*cols_per_row+j",
                  "            tb=top_base+(i+1)*cols_per_row+j",
                  "            ba=bottom_base+i*cols_per_row+j",
                  "            bb=bottom_base+(i+1)*cols_per_row+j",
                  "            self.f.extend([(ta,tb,ba),(tb,bb,ba)])",
                  "        # Close both ends; the snow mantle tapers to a fine feathered tip.",
                  "        for j in range(cols_per_row-1):",
                  "            ta=top_base+j; tc=top_base+j+1",
                  "            ba=bottom_base+j; bc=bottom_base+j+1",
                  "            self.f.extend([(ta,tc,ba),(tc,bc,ba)])",
                  "            ta=top_base+segments*cols_per_row+j",
                  "            tc=ta+1",
                  "            ba=bottom_base+segments*cols_per_row+j",
                  "            bc=ba+1",
                  "            self.f.extend([(ta,ba,tc),(tc,ba,bc)])",
              ])
              fn = fn[:face_start] + new_faces

          fn = fn.replace(
              "The deposit is a continuous surface strip, not a detached blob.",
              "The deposit is a closed snow mantle with a concealed underside embedded in the supporting wood."
          )
          s = s[:fn_start] + fn + s[fn_end:]
          if "bottom_verts.append(bottom_p)" not in s or "cols_per_row=len(cross)" not in s:
              raise SystemExit("Closed snow-cap geometry was not fully inserted.")
          compile(s, str(path), "exec")

          call_updates = [
              ("segments=20,start=.045,end=.975)", "segments=20,start=.045,end=.975,support_radii=[r0,r0*.49,.0035])", "main secondary twigs"),
              ("segments=12, start=.14, end=.96)", "segments=12, start=.14, end=.96,support_radii=[.010,.005,.0018])", "main tertiary forklets"),
              ("segments=20,start=.055,end=.965)", "segments=20,start=.055,end=.965,support_radii=[r0,r0*.42,.0015])", "branchlet fans"),
              ("segments=34,start=.015,end=.99)", "segments=34,start=.015,end=.99,support_radii=[base_r*1.28,base_r*.84,base_r*.39,.0065])", "primary boughs"),
              ("seed+2500+j*17+di,segments=8,start=.12,end=.92)", "seed+2500+j*17+di,segments=8,start=.12,end=.92,support_radii=[.018,.008,.0018])", "standalone bough secondary twigs"),
              ("seed+2700+j*19+di*11,segments=10,start=.14,end=.96)", "seed+2700+j*19+di*11,segments=10,start=.14,end=.96,support_radii=[.0045,.002,.0007])", "standalone bough forklets"),
              ("segments=36,start=.015,end=.99)", "segments=36,start=.015,end=.99,support_radii=[.062,.048,.029,.010])", "standalone main bough"),
          ]
          for old, new, label in call_updates:
              if new in s:
                  continue
              replace_once(old, new, label)

          if s.count("support_radii=[") != 7:
              raise SystemExit(f"Expected support radii on all 7 snow-ribbon call sites; found {s.count('support_radii=[')}")
          if "base_y=center[1]+lift+waviness" in s:
              raise SystemExit("Old fixed-height snow placement remains.")

          note = ("V52 snow-contact polish: every primary, secondary, tertiary and standalone-bough snow mantle is a closed cap whose concealed underside embeds into the local supporting wood radius. The contact skin follows each tapered branch and is protected against tip micro-relief, eliminating open-sheet gaps from different viewing angles. The approved crown silhouette, snow coverage, needle distribution and procedural random sequence are preserved.")
          lines = s.splitlines()
          note_lines = [i for i, line in enumerate(lines) if "stats['notes']=" in line]
          if len(note_lines) != 1:
              raise SystemExit("Could not uniquely locate the V52 stats note.")
          lines[note_lines[0]] = "    stats['notes']=" + repr(note)
          s = "\n".join(lines) + "\n"

          compile(s, str(path), "exec")
          path.write_text(s, encoding="utf-8")
          print("All seven snow mantles now use local branch radii; syntax check passed.")
          PY

      - name: Correct Blender Z-up scene framing for the whole tree
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("render-v52-source/v52/render_cycles_v52.py")
          source = path.read_text(encoding="utf-8")

          start = source.index("def setup_world_and_lights(scene):")
          end = source.index("\ndef make_camera(", start)
          new_setup = """def setup_world_and_lights(scene):
              world = bpy.data.worlds.new('Winter dusk | cool ambient')
              world.use_nodes = True
              world.node_tree.nodes['Background'].inputs['Color'].default_value = (0.055, 0.085, 0.13, 1)
              world.node_tree.nodes['Background'].inputs['Strength'].default_value = 0.34
              scene.world = world

              def area(name, location, power, color, size, target=(0.0, 0.0, 4.1)):
                  data = bpy.data.lights.new(name, 'AREA')
                  data.energy = power
                  data.color = color
                  data.shape = 'DISK'
                  data.size = size
                  obj = bpy.data.objects.new(name, data)
                  scene.collection.objects.link(obj)
                  obj.location = location
                  obj.rotation_euler = (Vector(target) - obj.location).to_track_quat('-Z', 'Y').to_euler()
                  return obj

              # GLB import converts the tree to Blender's native Z-up coordinates.
              area('Large soft warm winter key', (5.5, -7.0, 10.5), 3200, (1.0, 0.88, 0.77), 7.0)
              area('Cool sky fill', (-7.0, -3.0, 8.0), 2400, (0.70, 0.83, 1.0), 8.0)
              area('Blue snow rim', (1.0, 8.5, 9.0), 3600, (0.74, 0.86, 1.0), 6.0)
              area('Soft frontal detail fill', (0.0, -10.0, 6.5), 850, (0.86, 0.92, 1.0), 9.0)

              # A true horizontal studio floor sits below the tree on the Z-up ground plane.
              bpy.ops.mesh.primitive_plane_add(size=200, location=(0.0, 0.0, -0.105))
              floor = bpy.context.object
              floor.name = 'Matte snow studio floor'
              floor_mat = bpy.data.materials.new('Snow floor | matte blue-white')
              floor_mat.use_nodes = True
              floor_bs = floor_mat.node_tree.nodes.get('Principled BSDF')
              floor_bs.inputs['Base Color'].default_value = (0.42, 0.55, 0.68, 1)
              floor_bs.inputs['Roughness'].default_value = 0.94
              floor.data.materials.append(floor_mat)
          """
          source = source[:start] + new_setup + source[end:]

          old_camera = "                          tuple(tree_center), 46.0)"
          correct_camera = "                          tuple(tree_center), 40.0)"
          if old_camera in source:
              source = source.replace(old_camera, correct_camera, 1)
          elif correct_camera not in source:
              raise SystemExit("Neither the expected 46 mm nor corrected 40 mm Z-up camera line was found.")

          old_render = """render_to(scene, full_camera, 'V52_Cycles_FullTree_ZUp_Framed.png', 48, 1600, 1900)
          bpy.ops.wm.save_as_mainfile(filepath=os.path.join(HERE, 'Hero_Spruce_V52_ZUpFramed.blend'))
          print('Z_UP_FULL_TREE_RENDER_COMPLETE', flush=True)"""
          new_render = """render_to(scene, full_camera, 'V52_Cycles_FullTree_ZUp_Framed_40mm.png', 48, 1600, 1900)
          bpy.ops.wm.save_as_mainfile(filepath=os.path.join(HERE, 'Hero_Spruce_V52_ZUpFramed_40mm.blend'))
          print('Z_UP_FULL_TREE_RENDER_40MM_COMPLETE', flush=True)"""
          if old_render in source:
              source = source.replace(old_render, new_render, 1)
          elif new_render not in source:
              raise SystemExit("Neither the old nor corrected Z-up render block was found.")

          # The source script is already a single-view renderer.
          compile(source, str(path), "exec")
          detail_marker = "print('FRAMED_FULL_TREE_RENDER_COMPLETE', flush=True)"
          detail_lines = [
              "",
              "# Isolated close-up: inspect the branch/snow contact after the full-tree render.",
              "clear_scene()",
              "scene = bpy.context.scene",
              "bpy.ops.import_scene.gltf(filepath=BOUGH_GLB)",
              "bough_objects = [o for o in scene.objects if o.type == 'MESH']",
              "assign_materials(bough_objects)",
              "bounds = [obj.matrix_world @ Vector(corner) for obj in bough_objects for corner in obj.bound_box]",
              "detail_min = Vector((min(v.x for v in bounds), min(v.y for v in bounds), min(v.z for v in bounds)))",
              "detail_max = Vector((max(v.x for v in bounds), max(v.y for v in bounds), max(v.z for v in bounds)))",
              "detail_center = (detail_min + detail_max) * 0.5",
              "detail_world = bpy.data.worlds.new('Winter dusk | snow-contact close-up')",
              "detail_world.use_nodes = True",
              "detail_world.node_tree.nodes['Background'].inputs['Color'].default_value = (0.035, 0.055, 0.085, 1)",
              "detail_world.node_tree.nodes['Background'].inputs['Strength'].default_value = 0.42",
              "scene.world = detail_world",
              "def detail_area(name, offset, power, color, size):",
              "    data = bpy.data.lights.new(name, 'AREA')",
              "    data.energy = power",
              "    data.color = color",
              "    data.shape = 'DISK'",
              "    data.size = size",
              "    obj = bpy.data.objects.new(name, data)",
              "    scene.collection.objects.link(obj)",
              "    obj.location = detail_center + Vector(offset)",
              "    obj.rotation_euler = (detail_center - obj.location).to_track_quat('-Z', 'Y').to_euler()",
              "detail_area('Close-up warm key', (2.8, -3.2, 3.2), 1450, (1.0, 0.88, 0.76), 2.4)",
              "detail_area('Close-up cool fill', (-2.6, -1.2, 1.8), 1150, (0.70, 0.84, 1.0), 2.8)",
              "detail_area('Close-up rim', (0.3, 3.0, 2.2), 1650, (0.78, 0.88, 1.0), 2.0)",
              "detail_camera = make_camera('Bough snow-contact inspection', tuple(detail_center + Vector((0.15, 3.45, 1.25))), tuple(detail_center), 40.0)",
              "render_to(scene, detail_camera, 'V52_Cycles_Bough_SnowContact_Closeup.png', 48, 1500, 1000)",
              "bpy.ops.wm.save_as_mainfile(filepath=os.path.join(HERE, 'Hero_Spruce_V52_Bough_SnowContact_Inspection.blend'))",
              "print('BOUGH_SNOW_CONTACT_INSPECTION_COMPLETE', flush=True)",
          ]
          detail_code = "\n".join(detail_lines)
          if "V52_Cycles_Bough_SnowContact_Closeup.png" not in source:
              if detail_marker not in source:
                  raise SystemExit("Could not find the end of the full-tree render before adding the bough inspection.")
              source = source.replace(detail_marker, detail_marker + "\n" + detail_code, 1)
          path.write_text(source, encoding="utf-8")
          print("Applied Z-up camera, lights and horizontal floor; full tree target is computed from Blender world bounds.")
          PY

      - name: Rebuild V47 and final-polished V52 assets
        shell: bash
        run: |
          set -euo pipefail
          python -u render-v52-source/base/build_hero_spruce_v47.py | tee v47-build.log
          WINTERWORLD_V47_BASE="$GITHUB_WORKSPACE/render-v52-source/base" \
            python -u render-v52-source/v52/build_hero_spruce_v52.py | tee v52-build.log

      - name: Download verified Blender 5.2.3 LTS
        shell: bash
        run: |
          set -euo pipefail
          URL="https://download.blender.org/release/Blender5.2"
          curl --fail --location --retry 4 --retry-delay 3 \
            "$URL/blender-5.2.3-linux-x64.tar.xz" \
            --output "$RUNNER_TEMP/blender-5.2.3-linux-x64.tar.xz"
          curl --fail --location --retry 4 --retry-delay 3 \
            "$URL/blender-5.2.3.sha256" \
            --output "$RUNNER_TEMP/blender-5.2.3.sha256"
          grep "blender-5.2.3-linux-x64.tar.xz" "$RUNNER_TEMP/blender-5.2.3.sha256" \
            | sed "s|  blender-5.2.3-linux-x64.tar.xz|  $RUNNER_TEMP/blender-5.2.3-linux-x64.tar.xz|" \
            | sha256sum --check -
          tar -xJf "$RUNNER_TEMP/blender-5.2.3-linux-x64.tar.xz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/blender-5.2.3-linux-x64/blender" --version

      - name: Render framed full tree with Cycles
        working-directory: render-v52-source/v52
        shell: bash
        run: |
          set -o pipefail
          "$RUNNER_TEMP/blender-5.2.3-linux-x64/blender" \
            --background --factory-startup \
            --python render_cycles_v52.py \
            --python-exit-code 1 2>&1 | tee "$GITHUB_WORKSPACE/framed-render.log"

      - name: Save framed camera settings in source ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f render-v52-source.zip
          zip -qr render-v52-source.zip \
            render-v52-source/base/build_hero_spruce_v47.py \
            render-v52-source/v52/build_hero_spruce_v52.py \
            render-v52-source/v52/render_cycles_v52.py \
            render-v52-source/README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add render-v52-source.zip
          git commit -m "Polish V52 branch collars and grounded roots; frame final tree"
          git push origin HEAD:render-v52-cycles

      - name: Upload framed preview and native scene
        uses: actions/upload-artifact@v4
        with:
          name: WinterWorld-V52-Final-Polish
          path: |
            render-v52-source/v52/cycles_renders/V52_Cycles_FullTree_ZUp_Framed_40mm.png
            render-v52-source/v52/cycles_renders/V52_Cycles_Bough_SnowContact_Closeup.png
            render-v52-source/v52/Hero_Spruce_V52_Bough_SnowContact_Inspection.blend
            render-v52-source/v52/Hero_Spruce_V52_ZUpFramed_40mm.blend
            render-v52-source/v52/Hero_Spruce_V52_GameLOD.glb
            render-v52-source/v52/Hero_Spruce_V52_Bough.glb
            render-v52-source/v52/Hero_Spruce_V52_Stats.json
            render-v52-source.zip
            v47-build.log
            v52-build.log
            framed-render.log
          if-no-files-found: error
          retention-days: 14
