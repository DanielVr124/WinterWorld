name: Publish Winter World Playtest

on:
  push:
    branches:
      - main
    paths:
      - WinterWorld_Playtest.zip
  workflow_run:
    workflows:
      - Build Winter World 015 with final V52 hero spruce
      - Build Winter World 016 with upright V52 conifer forest
      - Build Winter World 017 with intact V52 forest LODs
      - Build Winter World 018 with fuller V52 conifer detail
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      USE_BUILD_015: ${{ github.event_name == 'workflow_run' }}
      BUILD_ARCHIVE: ${{ github.event.workflow_run.name == 'Build Winter World 018 with fuller V52 conifer detail' && 'WinterWorld_Playtest_Build018_V52_FullerConiferForest.zip' || (github.event.workflow_run.name == 'Build Winter World 017 with intact V52 forest LODs' && 'WinterWorld_Playtest_Build017_V52_ForestLODRepair.zip') || (github.event.workflow_run.name == 'Build Winter World 016 with upright V52 conifer forest' && 'WinterWorld_Playtest_Build016_V52_ConiferForest.zip' || 'WinterWorld_Playtest_Build015_V52.zip') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download Build 015 artifact
        if: env.USE_BUILD_015 == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.workflow_run.name == 'Build Winter World 018 with fuller V52 conifer detail' && 'WinterWorld-Build018-V52-FullerConiferForest' || (github.event.workflow_run.name == 'Build Winter World 017 with intact V52 forest LODs' && 'WinterWorld-Build017-V52-ForestLODRepair') || (github.event.workflow_run.name == 'Build Winter World 016 with upright V52 conifer forest' && 'WinterWorld-Build016-V52-ConiferForest' || 'WinterWorld-Build015-V52-HeroSpruce') }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: artifacts

      - name: Check playtest archive
        shell: bash
        run: |
          if [[ "$USE_BUILD_015" == "true" ]]; then
            ARCHIVE="artifacts/$BUILD_ARCHIVE"
          else
            ARCHIVE="WinterWorld_Playtest.zip"
          fi
          if [[ ! -s "$ARCHIVE" ]]; then
            echo "::error::Required Winter World playtest archive is missing: $ARCHIVE"
            exit 1
          fi

      - name: Extract and validate game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package _site
          if [[ "$USE_BUILD_015" == "true" ]]; then
            unzip -q "artifacts/$BUILD_ARCHIVE" -d package
          else
            unzip -q WinterWorld_Playtest.zip -d package
          fi

          GAME_DIR="package/WinterWorld_Prototype"
          for file in index.html style.css src/main.js src/sakura_mesh_data.js; do
            if [[ ! -s "$GAME_DIR/$file" ]]; then
              echo "::error::Expected game file is missing: $GAME_DIR/$file"
              exit 1
            fi
          done
          if [[ "$USE_BUILD_015" == "true" ]]; then
            for file in src/hero_spruce_v52_data.js src/hero_spruce_v52_stats.json; do
              if [[ ! -s "$GAME_DIR/$file" ]]; then
                echo "::error::Build 015 asset is missing: $GAME_DIR/$file"
                exit 1
              fi
            done
            if [[ "$BUILD_ARCHIVE" == "WinterWorld_Playtest_Build016_V52_ConiferForest.zip" || "$BUILD_ARCHIVE" == "WinterWorld_Playtest_Build017_V52_ForestLODRepair.zip" || "$BUILD_ARCHIVE" == "WinterWorld_Playtest_Build018_V52_FullerConiferForest.zip" ]]; then
              for file in src/forest_spruce_v52_data.js; do
                if [[ ! -s "$GAME_DIR/$file" ]]; then
                  echo "::error::Build 016 asset is missing: $GAME_DIR/$file"
                  exit 1
                fi
              done
            fi
          fi

          cp -a "$GAME_DIR/." _site/
          touch _site/.nojekyll

          # Version the static URLs with this commit SHA so browsers fetch each new build.
          python - <<'PY'
          import os
          from pathlib import Path

          index = Path("_site/index.html")
          html = index.read_text(encoding="utf-8")
          version = os.environ["GITHUB_RUN_ID"]
          replacements = {
              'href="style.css"': f'href="style.css?v={version}"',
              'src="src/sakura_mesh_data.js"': f'src="src/sakura_mesh_data.js?v={version}"',
              'src="src/main.js"': f'src="src/main.js?v={version}"',
          }
          if 'src="src/hero_spruce_v52_data.js"' in html:
              replacements['src="src/hero_spruce_v52_data.js"'] = f'src="src/hero_spruce_v52_data.js?v={version}"'
          if 'src="src/forest_spruce_v52_data.js"' in html:
              replacements['src="src/forest_spruce_v52_data.js"'] = f'src="src/forest_spruce_v52_data.js?v={version}"'
          for old, new in replacements.items():
              if old not in html:
                  raise SystemExit(f"Expected cacheable asset reference not found: {old}")
              html = html.replace(old, new)
          index.write_text(html, encoding="utf-8")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
