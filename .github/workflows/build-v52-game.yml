name: Build Winter World 018 with fuller V52 conifer detail

on:
  push:
    branches:
      - render-v52-cycles
    paths:
      - .github/workflows/build-v52-game.yml
      - scripts/build_v52_game_lod.py
      - scripts/integrate_v52_game.py

permissions:
  contents: read
  actions: read

concurrency:
  group: winterworld-build018-v52-fuller-forest
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out Winter World source
        uses: actions/checkout@v4

      - name: Download the final V52 Cycles artifact
        uses: actions/download-artifact@v4
        with:
          name: WinterWorld-V52-Final-Polish
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 41794906407
          path: v52-artifact

      - name: Extract Build 014 and V52 model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          unzip -q WinterWorld_Playtest.zip -d work
          test -s v52-artifact/render-v52-source/v52/Hero_Spruce_V52_GameLOD.glb
          test -s work/WinterWorld_Prototype/src/main.js
          echo "Build 014 source ready"
          du -h v52-artifact/render-v52-source/v52/Hero_Spruce_V52_GameLOD.glb

      - name: Download verified Blender 5.2.3 LTS
        shell: bash
        run: |
          set -euo pipefail
          URL="https://download.blender.org/release/Blender5.2"
          curl --fail --location --retry 4 --retry-delay 3 \
            "$URL/blender-5.2.3-linux-x64.tar.xz" \
            --output "${RUNNER_TEMP}/blender-5.2.3-linux-x64.tar.xz"
          curl --fail --location --retry 4 --retry-delay 3 \
            "$URL/blender-5.2.3.sha256" \
            --output "${RUNNER_TEMP}/blender-5.2.3.sha256"
          grep "blender-5.2.3-linux-x64.tar.xz" "${RUNNER_TEMP}/blender-5.2.3.sha256" \
            | sed "s|  blender-5.2.3-linux-x64.tar.xz|  ${RUNNER_TEMP}/blender-5.2.3-linux-x64.tar.xz|" \
            | sha256sum --check -
          tar -xJf "${RUNNER_TEMP}/blender-5.2.3-linux-x64.tar.xz" -C "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/blender-5.2.3-linux-x64/blender" --version

      - name: Convert V52 to upright hero and forest WebGL2 LODs
        env:
          V52_INPUT_GLB: ${{ github.workspace }}/v52-artifact/render-v52-source/v52/Hero_Spruce_V52_GameLOD.glb
          V52_OUTPUT_HERO_JS: ${{ github.workspace }}/work/WinterWorld_Prototype/src/hero_spruce_v52_data.js
          V52_OUTPUT_FOREST_JS: ${{ github.workspace }}/work/WinterWorld_Prototype/src/forest_spruce_v52_data.js
          V52_OUTPUT_STATS: ${{ github.workspace }}/work/WinterWorld_Prototype/src/hero_spruce_v52_stats.json
          V52_OUTPUT_PREVIEW: ${{ github.workspace }}/V52_Build018_Hero_vs_ForestLOD.png
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/blender-5.2.3-linux-x64/blender" \
            --background --factory-startup \
            --python-exit-code 1 \
            --python scripts/build_v52_game_lod.py

      - name: Integrate V52 into the playable scene
        run: |
          set -euo pipefail
          python scripts/integrate_v52_game.py work/WinterWorld_Prototype

      - name: Write Build 018 documentation and test context
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          game = Path("work/WinterWorld_Prototype")
          index = game / "index.html"
          html = index.read_text(encoding="utf-8")
          html = html.replace("Development Build 016", "Development Build 018")
          html = html.replace("DEVELOPMENT BUILD 016 · M2", "DEVELOPMENT BUILD 017 · M2")
          html = html.replace(
              "Final V52 spruce across the entire conifer forest · Build 016",
              "Intact snow and needle islands in every repeated V52 forest tree · Build 018"
          )
          html = html.replace(
              "M2 VISUAL BENCHMARK · V52 SPRUCE USED FOR EVERY CONIFER · BAKERY, NPC AI & WORLD EXPANSION STILL AHEAD",
              "M2 VISUAL BENCHMARK · SHAPE-PRESERVING V52 FOREST LOD · BAKERY, NPC AI & WORLD EXPANSION STILL AHEAD"
          )
          index.write_text(html, encoding="utf-8")

          changelog = """# Build 018 — Fuller V52 Forest Detail Repair

          ## Fixed
          - Removed random per-face deletion that had fragmented snow patches and individual needles in repeated forest trees.
          - The forest LOD now retains complete connected snow and needle islands.
          - Increased repeated-tree bough detail while keeping a measured per-instance geometry budget.
          - Preserved the V52 Blender Z-up to WebGL Y-up conversion and ground-root normalization.

          ## Implemented
          - The near-path showcase tree keeps the high-detail V52 hero mesh.
          - Every other conifer—including understory and distant ridgeline placements—uses the repaired V52 forest LOD from the same source asset.
          - Per-instance scale, rotation, and subtle tint variation remain.
          - Sakura grove, terrain, path, cabin, rocks, lanterns, controls, collisions, fog, snowfall, settings, and world layout remain unchanged.

          ## Validation and reports
          - Automated checks cover coordinate conversion, orientation, root placement, mesh buffers, finite attributes, index bounds, scene integration, and ZIP integrity.
          - The build publishes a human-readable test report and machine-readable QA JSON.
          - A Blender render compares the actual exported hero and forest LOD meshes.
          - In-browser visual review and target-PC FPS remain pending user testing.
          """
          (game / "BUILD_018_CHANGELOG.md").write_text(changelog, encoding="utf-8")

          readme = """# Winter World — Development Build 018

          A Windows-friendly HTML/WebGL2 first-person winter-world prototype. Build 018 repairs the repeated V52 forest LOD by preserving complete snow patches and needle islands instead of randomly cutting their faces. The near-path showcase remains the high-detail V52 hero tree.

          ## Run the world
          1. Extract the ZIP.
          2. Open the WinterWorld_Prototype folder.
          3. Open index.html in a current Chrome or Edge browser.
          4. Click Enter the World.

          If local-file rendering is blocked, run py -m http.server 8000 in this folder and open http://127.0.0.1:8000/.

          ## Controls
          - W, A, S, D or arrow keys: move
          - Mouse: look around
          - Shift: move faster
          - Esc: release the mouse / close settings
          - Click the scene: capture the mouse
          - E: development note
          - F3: performance and player diagnostics

          ## Build 018 — V52 Forest LOD Repair
          - Preserves whole connected snow and needle islands in repeated V52 trees.
          - Increases bough detail in the shared forest LOD.
          - Retains the high-detail hero and the same V52 source for all other conifers.
          - Includes the automated test report, QA JSON, and actual Blender LOD comparison render.
          - In-browser visuals and target-PC FPS still need user review.
          """
          (game / "README.md").write_text(readme, encoding="utf-8")

          progress = """# Winter World — Development Progress

          ## Current status
          - **Latest build:** 017
          - **Current milestone:** M2 — Quality Benchmark
          - **Current sub-pass:** Shape-preserving V52 forest LOD repair
          - **Build 016 issue:** The repeated forest LOD was reduced by randomly deleting individual faces from dense snow and needle meshes. This fragmented the authored surfaces and caused non-hero trees to look broken.
          - **Build 018 fix:** Complete connected snow and needle islands are sampled as units. The forest LOD retains intact authored pieces while remaining lighter than the full hero mesh.

          ## Build 018 — Implemented
          - V52 Z-up to WebGL Y-up conversion and y=0 root normalization retained.
          - Every conifer still uses the V52 source asset.
          - Snow and needle geometry uses deterministic higher-density whole-island sampling, not random face deletion.
          - Added geometry QA, a test report, and an actual Blender LOD comparison render.

          ## Pending
          - User visual confirmation in the live browser.
          - Target-PC frame-rate and visual review.
          """
          (game / "PROGRESS.md").write_text(progress, encoding="utf-8")
          PY

      - name: Validate JavaScript, mesh buffers, and package
        shell: bash
        run: |
          set -euo pipefail
          cd work/WinterWorld_Prototype
          node --check src/main.js
          node --check src/sakura_mesh_data.js
          node --check src/hero_spruce_v52_data.js
          node --check src/forest_spruce_v52_data.js
          node - <<'JS'
          const fs = require('fs');
          const vm = require('vm');

          function validateMesh(file, globalName, minTriangles, maxTriangles) {
            const context = { window: {} };
            vm.runInNewContext(fs.readFileSync(file, 'utf8'), context);
            const d = context.window[globalName];
            if (!d || !d.vertexCount || !d.triangleCount) throw new Error(globalName + ' metadata missing');
            const vertices = Buffer.from(d.vertices, 'base64');
            const indices = Buffer.from(d.indices, 'base64');
            if (vertices.length !== d.vertexCount * 9 * 4) throw new Error(globalName + ' vertex buffer length mismatch');
            if (indices.length !== d.triangleCount * 3 * 4) throw new Error(globalName + ' index buffer length mismatch');
            const floats = new Float32Array(vertices.buffer, vertices.byteOffset, vertices.length / 4);
            for (let i = 0; i < floats.length; i++) if (!Number.isFinite(floats[i])) throw new Error(globalName + ' contains a non-finite vertex attribute');
            const ix = new Uint32Array(indices.buffer, indices.byteOffset, indices.length / 4);
            let max = 0;
            for (const value of ix) if (value > max) max = value;
            if (max >= d.vertexCount) throw new Error(globalName + ' index exceeds vertex buffer');
            if (d.triangleCount < minTriangles || d.triangleCount > maxTriangles) throw new Error(globalName + ' triangle budget exceeded');
            return {vertices:d.vertexCount,triangles:d.triangleCount,maxIndex:max,vertexBytes:vertices.length,indexBytes:indices.length};
          }

          const hero = validateMesh('src/hero_spruce_v52_data.js', 'WinterWorldHeroSpruceV52Data', 180000, 900000);
          const forest = validateMesh('src/forest_spruce_v52_data.js', 'WinterWorldForestSpruceV52Data', 150000, 190000);
          const stats = JSON.parse(fs.readFileSync('src/hero_spruce_v52_stats.json', 'utf8'));
          for (const lod of [stats.hero_lod, stats.forest_lod]) {
            if (!lod || lod.coordinate_conversion.position_and_normal_mapping !== '(x, y, z) -> (x, z, -y)') throw new Error('V52 axis conversion metadata missing');
            if (!(lod.bounds_m.height > Math.max(lod.bounds_m.width, lod.bounds_m.depth))) throw new Error('V52 mesh failed upright bounds check');
            if (Math.abs(lod.bounds_m.height - stats.hero_lod.bounds_m.height) > 0.03) throw new Error('Hero/forest tree heights do not match');
          }
          for (const name of ['Spruce_Settled_Snow_Patches','Spruce_Individual_Needles']) {
            const sampling = stats.forest_lod.components[name]?.island_sampling;
            if (!sampling || sampling.method !== 'deterministic_whole_connected_islands') throw new Error(name + ' is not using higher-density intact-island sampling');
            if (!sampling.retained_islands || sampling.retained_islands < 1) throw new Error(name + ' retained no complete islands');
            if (sampling.actual_face_percent < 14 || sampling.actual_face_percent > 21) throw new Error(name + ' island sample is outside the quality budget');
          }
          const html = fs.readFileSync('index.html', 'utf8');
          for (const file of ['src/hero_spruce_v52_data.js','src/forest_spruce_v52_data.js']) {
            if (!html.includes(file)) throw new Error(file + ' not loaded by index.html');
          }
          const main = fs.readFileSync('src/main.js', 'utf8');
          if (main.includes('mesh:firSpecies[') || main.includes('add(pineCone')) throw new Error('Legacy conifer placement remains');
          if (!main.includes('mesh:forestSpruceV52Mesh')) throw new Error('V52 forest mesh not used for conifer placement');
          const qa = {
            build: '018',
            source: 'V52 Cycles spruce',
            automated_tests: [
              {name:'Hero and forest WebGL mesh buffers',status:'PASS',details:'Buffer lengths, finite attributes, valid indices, and triangle budgets'},
              {name:'Blender Z-up to WebGL Y-up conversion',status:'PASS',details:stats.coordinate_conversion.position_and_normal_mapping},
              {name:'Tree orientation and matching height',status:'PASS',details:'Both LOD bounds are upright and height-matched'},
              {name:'Root snow skirt placement',status:'PASS',details:'Lowest vertex normalized to y=0'},
              {name:'Intact snow and needle islands',status:'PASS',details:'Forest LOD uses deterministic whole-connected-island sampling'},
              {name:'All conifer placements use V52',status:'PASS',details:'No legacy procedural or cone fallback remains'},
              {name:'JavaScript syntax',status:'PASS'},
            ],
            meshes:{hero,forest},
            mesh_stats:stats,
            manual_tests:[
              {name:'Visual review in live browser',status:'PENDING_USER_REVIEW'},
              {name:'Target-PC frame-rate check',status:'PENDING_USER_REVIEW'},
            ]
          };
          fs.writeFileSync('../../BUILD_018_TEST_REPORT.json', JSON.stringify(qa,null,2));
          console.log(JSON.stringify({hero,forest,coordinateConversion:stats.coordinate_conversion},null,2));
          JS
          cd ../..
          cd work && zip -qr -9 ../WinterWorld_Playtest_Build018_V52_FullerConiferForest.zip WinterWorld_Prototype && cd ..
          unzip -tq WinterWorld_Playtest_Build018_V52_FullerConiferForest.zip
          python - <<'PY'
          import json
          from pathlib import Path
          report_path = Path('BUILD_018_TEST_REPORT.json')
          report = json.loads(report_path.read_text(encoding='utf-8'))
          report['automated_tests'].append({'name': 'Playable ZIP integrity', 'status': 'PASS', 'details': 'unzip -t completed without errors'})
          report_path.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          lines = [
              '# Build 018 — Automated Test Report',
              '',
              '## Automated checks',
              '',
          ]
          for test in report['automated_tests']:
              lines.append(f"- **{test['status']}** — {test['name']}: {test.get('details', '')}")
          forest = report['mesh_stats']['forest_lod']
          hero = report['mesh_stats']['hero_lod']
          lines += [
              '', '## Geometry summary', '',
              f"- Hero V52 LOD: {hero['game_triangles']:,} triangles; {hero['vertex_count']:,} vertices.",
              f"- Repeated forest V52 LOD: {forest['game_triangles']:,} triangles; {forest['vertex_count']:,} vertices.",
              f"- Upright bounds: {hero['bounds_m']['height']:.3f} m high; forest width {forest['bounds_m']['width']:.3f} m; depth {forest['bounds_m']['depth']:.3f} m.",
              '- Snow and needle faces are retained as complete connected islands, rather than randomly selected individual faces.',
              '', '## Not yet verified', '',
              '- **Pending user review:** actual appearance in the live browser on the user\'s display.',
              '- **Pending user review:** frame rate on the target PC. CI geometry and syntax checks do not establish target-hardware FPS.',
              '', '## Blender preview', '',
              'The attached `V52_Build018_Hero_vs_ForestLOD.png` is rendered from the actual exported buffers for the hero and repeated forest LOD.',
          ]
          Path('BUILD_018_TEST_REPORT.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          ls -lh WinterWorld_Playtest_Build018_V52_FullerConiferForest.zip BUILD_018_TEST_REPORT.md BUILD_018_TEST_REPORT.json V52_Build018_Hero_vs_ForestLOD.png work/WinterWorld_Prototype/src/hero_spruce_v52_stats.json work/WinterWorld_Prototype/src/forest_spruce_v52_data.js

      - name: Upload Build 018 repair build, reports, and renders
        uses: actions/upload-artifact@v4
        with:
          name: WinterWorld-Build018-V52-FullerConiferForest
          path: |
            WinterWorld_Playtest_Build018_V52_FullerConiferForest.zip
            work/WinterWorld_Prototype/src/hero_spruce_v52_stats.json
            work/WinterWorld_Prototype/BUILD_018_CHANGELOG.md
            BUILD_018_TEST_REPORT.md
            BUILD_018_TEST_REPORT.json
            V52_Build018_Hero_vs_ForestLOD.png
            v52-artifact/render-v52-source/v52/cycles_renders/V52_Cycles_FullTree_ZUp_Framed_40mm.png
            v52-artifact/render-v52-source/v52/cycles_renders/V52_Cycles_Bough_SnowContact_Closeup.png
          if-no-files-found: error
          retention-days: 14

