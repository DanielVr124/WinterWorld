name: Build Winter World 015 with final V52 hero spruce

on:
  push:
    branches:
      - render-v52-cycles
    paths:
      - .github/workflows/build-v52-game.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: winterworld-build015-v52
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out Winter World source
        uses: actions/checkout@v4

      - name: Download the final V52 Cycles artifact
        uses: actions/download-artifact@v4
        with:
          name: WinterWorld-V52-Final-Polish
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 41794906407
          path: v52-artifact

      - name: Extract Build 014 and V52 model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          unzip -q WinterWorld_Playtest.zip -d work
          test -s v52-artifact/render-v52-source/v52/Hero_Spruce_V52_GameLOD.glb
          test -s work/WinterWorld_Prototype/src/main.js
          echo "Build 014 source ready"
          du -h v52-artifact/render-v52-source/v52/Hero_Spruce_V52_GameLOD.glb

      - name: Download verified Blender 5.2.3 LTS
        shell: bash
        run: |
          set -euo pipefail
          URL="https://download.blender.org/release/Blender5.2"
          curl --fail --location --retry 4 --retry-delay 3 \
            "$URL/blender-5.2.3-linux-x64.tar.xz" \
            --output "${RUNNER_TEMP}/blender-5.2.3-linux-x64.tar.xz"
          curl --fail --location --retry 4 --retry-delay 3 \
            "$URL/blender-5.2.3.sha256" \
            --output "${RUNNER_TEMP}/blender-5.2.3.sha256"
          grep "blender-5.2.3-linux-x64.tar.xz" "${RUNNER_TEMP}/blender-5.2.3.sha256" \
            | sed "s|  blender-5.2.3-linux-x64.tar.xz|  ${RUNNER_TEMP}/blender-5.2.3-linux-x64.tar.xz|" \
            | sha256sum --check -
          tar -xJf "${RUNNER_TEMP}/blender-5.2.3-linux-x64.tar.xz" -C "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/blender-5.2.3-linux-x64/blender" --version

      - name: Convert V52 to a WebGL2 game LOD
        env:
          V52_INPUT_GLB: ${{ github.workspace }}/v52-artifact/render-v52-source/v52/Hero_Spruce_V52_GameLOD.glb
          V52_OUTPUT_JS: ${{ github.workspace }}/work/WinterWorld_Prototype/src/hero_spruce_v52_data.js
          V52_OUTPUT_STATS: ${{ github.workspace }}/work/WinterWorld_Prototype/src/hero_spruce_v52_stats.json
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/blender-5.2.3-linux-x64/blender" \
            --background --factory-startup \
            --python scripts/build_v52_game_lod.py

      - name: Integrate V52 into the playable scene
        run: |
          set -euo pipefail
          python scripts/integrate_v52_game.py work/WinterWorld_Prototype

      - name: Validate JavaScript, mesh buffers, and package
        shell: bash
        run: |
          set -euo pipefail
          cd work/WinterWorld_Prototype
          node --check src/main.js
          node --check src/sakura_mesh_data.js
          node --check src/hero_spruce_v52_data.js
          node - <<'JS'
          const fs = require('fs');
          const vm = require('vm');
          const context = { window: {} };
          vm.runInNewContext(fs.readFileSync('src/hero_spruce_v52_data.js', 'utf8'), context);
          const d = context.window.WinterWorldHeroSpruceV52Data;
          if (!d || !d.vertexCount || !d.triangleCount) throw new Error('V52 mesh metadata missing');
          const vertices = Buffer.from(d.vertices, 'base64');
          const indices = Buffer.from(d.indices, 'base64');
          if (vertices.length !== d.vertexCount * 9 * 4) throw new Error('V52 vertex buffer length mismatch');
          if (indices.length !== d.triangleCount * 3 * 4) throw new Error('V52 index buffer length mismatch');
          const floats = new Float32Array(vertices.buffer, vertices.byteOffset, vertices.length / 4);
          for (let i = 0; i < floats.length; i++) if (!Number.isFinite(floats[i])) throw new Error('Non-finite V52 vertex attribute');
          const ix = new Uint32Array(indices.buffer, indices.byteOffset, indices.length / 4);
          let max = 0;
          for (const value of ix) if (value > max) max = value;
          if (max >= d.vertexCount) throw new Error('V52 index exceeds vertex buffer');
          if (d.triangleCount < 180000 || d.triangleCount > 450000) throw new Error('V52 LOD triangle budget exceeded');
          const html = fs.readFileSync('index.html', 'utf8');
          if (!html.includes('src/hero_spruce_v52_data.js')) throw new Error('V52 data script not loaded by index.html');
          console.log(JSON.stringify({vertices:d.vertexCount,triangles:d.triangleCount,maxIndex:max,vertexBytes:vertices.length,indexBytes:indices.length}));
          JS
          cd ../..
          zip -qr -9 WinterWorld_Playtest_Build015_V52.zip WinterWorld_Prototype
          unzip -tq WinterWorld_Playtest_Build015_V52.zip
          ls -lh WinterWorld_Playtest_Build015_V52.zip work/WinterWorld_Prototype/src/hero_spruce_v52_stats.json

      - name: Upload Build 015 and integration stats
        uses: actions/upload-artifact@v4
        with:
          name: WinterWorld-Build015-V52-HeroSpruce
          path: |
            WinterWorld_Playtest_Build015_V52.zip
            work/WinterWorld_Prototype/src/hero_spruce_v52_stats.json
            work/WinterWorld_Prototype/BUILD_015_CHANGELOG.md
            v52-artifact/render-v52-source/v52/cycles_renders/V52_Cycles_FullTree_ZUp_Framed_40mm.png
            v52-artifact/render-v52-source/v52/cycles_renders/V52_Cycles_Bough_SnowContact_Closeup.png
          if-no-files-found: error
          retention-days: 14
