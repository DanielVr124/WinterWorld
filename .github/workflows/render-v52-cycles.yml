name: Render Winter World V52 with Blender Cycles

on:
  push:
    branches:
      - render-v52-cycles
    paths:
      - render-v52-source.zip
      - .github/workflows/render-v52-cycles.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winterworld-v52-cycles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out render job
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install geometry build dependencies
        run: python -m pip install --upgrade numpy scipy trimesh

      - name: Verify geometry acceleration dependencies
        run: |
          python - <<'PY'
          import numpy, scipy, trimesh
          print(f"NumPy {numpy.__version__}")
          print(f"SciPy {scipy.__version__}")
          print(f"Trimesh {trimesh.__version__}")
          PY

      - name: Verify and extract reproducible V52 source
        shell: bash
        run: |
          set -euo pipefail
          test -s render-v52-source.zip
          echo "ca01fd9004e287a20c6640e2068bdbc2c8777d8f13301dc8b1264cc504dd7b72  render-v52-source.zip" | sha256sum --check -
          unzip -q render-v52-source.zip
          test -s render-v52-source/base/build_hero_spruce_v47.py
          test -s render-v52-source/v52/build_hero_spruce_v52.py
          test -s render-v52-source/v52/render_cycles_v52.py

      - name: Rebuild V47 base mesh
        working-directory: render-v52-source/base
        run: python -u build_hero_spruce_v47.py

      - name: Rebuild V52 geometry from V47 source
        working-directory: render-v52-source/v52
        env:
          WINTERWORLD_V47_BASE: ${{ github.workspace }}/render-v52-source/base
        run: python -u build_hero_spruce_v52.py

      - name: Download official Blender 5.2.3 LTS
        shell: bash
        run: |
          set -euo pipefail
          URL="https://download.blender.org/release/Blender5.2"
          curl --fail --location --retry 4 --retry-delay 3 \
            "$URL/blender-5.2.3-linux-x64.tar.xz" \
            --output "$RUNNER_TEMP/blender-5.2.3-linux-x64.tar.xz"
          curl --fail --location --retry 4 --retry-delay 3 \
            "$URL/blender-5.2.3.sha256" \
            --output "$RUNNER_TEMP/blender-5.2.3.sha256"
          grep "blender-5.2.3-linux-x64.tar.xz" "$RUNNER_TEMP/blender-5.2.3.sha256" \
            | sed "s|  blender-5.2.3-linux-x64.tar.xz|  $RUNNER_TEMP/blender-5.2.3-linux-x64.tar.xz|" \
            | sha256sum --check -
          tar -xJf "$RUNNER_TEMP/blender-5.2.3-linux-x64.tar.xz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/blender-5.2.3-linux-x64/blender" --version

      - name: Render hero tree and bough with Cycles CPU
        working-directory: render-v52-source/v52
        shell: bash
        run: |
          set -o pipefail
          "$RUNNER_TEMP/blender-5.2.3-linux-x64/blender" \
            --background --factory-startup \
            --python render_cycles_v52.py \
            --python-exit-code 1 2>&1 | tee "$GITHUB_WORKSPACE/cycles-render.log"

      - name: Upload verified Cycles renders and Blender scene
        uses: actions/upload-artifact@v4
        with:
          name: WinterWorld-V52-Cycles-Renders
          path: |
            render-v52-source/v52/cycles_renders/
            render-v52-source/v52/Hero_Spruce_V52_Cycles.blend
            render-v52-source/v52/Hero_Spruce_V52_GameLOD.glb
            render-v52-source/v52/Hero_Spruce_V52_Bough.glb
            render-v52-source/v52/Hero_Spruce_V52_Stats.json
            cycles-render.log
          if-no-files-found: error
          retention-days: 14
