name: Naturalize V52 spruce snow and render

on:
  push:
    branches:
      - render-v52-cycles
    paths:
      - .github/workflows/naturalize-snow-v52.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  natural-snow:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out render branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install geometry dependencies
        run: python -m pip install --upgrade numpy scipy trimesh

      - name: Extract V52 source
        shell: bash
        run: |
          set -euo pipefail
          unzip -t render-v52-source.zip
          unzip -q render-v52-source.zip
          test -s render-v52-source/base/build_hero_spruce_v47.py
          test -s render-v52-source/v52/build_hero_spruce_v52.py
          test -s render-v52-source/v52/render_cycles_v52.py

      - name: Replace segmented snow caps with natural continuous mantles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("render-v52-source/v52/build_hero_spruce_v52.py")
          s = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f"Missing exact marker: {label}")
              s = s.replace(old, new, 1)

          def replace_between(start, end, new, label):
              global s
              i = s.index(start)
              j = s.index(end, i)
              s = s[:i] + new + s[j:]

          replace_once("        cross=np.linspace(-1.0,1.0,13,dtype=float)",
                       "        cross=np.linspace(-1.0,1.0,21,dtype=float)", "cross resolution")
          replace_once("        station_noise=rng.uniform(-.060,.060,segments+1)",
                       "        station_noise=rng.uniform(-.105,.105,segments+1)", "edge noise")
          replace_once("            edge_wave=(.90+.070*np.sin(u*math.tau*2.4+phase)\n                       +.050*np.sin(u*math.tau*6.2-phase*.6)+station_noise[i])",
                       "            edge_wave=(.92+.085*np.sin(u*math.tau*1.7+phase)\n                       +.060*np.sin(u*math.tau*4.3-phase*.6)+station_noise[i])",
                       "low-frequency edge drift")

          replace_between(
              "                    if local.random() < .98:",
              "                    secondary_positions=",
              "                    # One connected snow mantle follows each secondary twig.\n"
              "                    # Fewer, longer deposits avoid the repeated placed-cap look.\n"
              "                    if local.random() < .82:\n"
              "                        snow.add_snow_ribbon([root,mid,tip],\n"
              "                            half_width=local.uniform(.038,.047)*(1-.20*t),\n"
              "                            thickness=local.uniform(.018,.024)*(1-.12*t),\n"
              "                            lift=.035*(1-.12*t),\n"
              "                            seed=branch_seed+4200+j*29+side_sign*7,\n"
              "                            segments=20,start=.045,end=.975)\n",
              "secondary twig mantle")

          replace_between(
              "                            if local.random() < .66:",
              "                            needles.add_spray(fm,fd",
              "                            if local.random() < .34:\n"
              "                                snow.add_snow_ribbon([fork_root,fm,ft],\n"
              "                                    half_width=.015*(1-.20*t), thickness=.0085,\n"
              "                                    lift=.016, seed=branch_seed+5100+j*31,\n"
              "                                    segments=12, start=.14, end=.96)\n",
              "tertiary twig snow")

          replace_between(
              "                    if di in (0,1,2) and local.random() < .985:",
              "                    shoot_axis=unit(stip-root)",
              "                    if di in (0,1,2) and local.random() < .76:\n"
              "                        # A single, feather-edged mantle runs along the whole fan.\n"
              "                        snow.add_snow_ribbon([root,smid,stip],\n"
              "                            half_width=local.uniform(.041,.052)*(1-.20*t),\n"
              "                            thickness=local.uniform(.018,.024),\n"
              "                            lift=.030, seed=branch_seed+5300+si*13+di*3,\n"
              "                            segments=20,start=.055,end=.965)\n",
              "branchlet fan mantle")

          replace_between(
              "            # Individually settled snow strips follow the primary bough's changing",
              "    # A broken, slender crown leader",
              "            # One long, naturally irregular mantle follows the primary bough.\n"
              "            # It tapers only near the branch base and tip; it is not split into\n"
              "            # repeated short caps, so the snow reads as a connected drift.\n"
              "            snow_chance=.96 if detail=='hero' else .90\n"
              "            if local.random()<snow_chance:\n"
              "                snow.add_snow_ribbon([p0,p1,p2,p3],\n"
              "                    half_width=local.uniform(.062,.076)*(1-t*.28),\n"
              "                    thickness=local.uniform(.034,.043)*(1-t*.14),\n"
              "                    lift=local.uniform(.056,.070)*(1-t*.12),\n"
              "                    seed=branch_seed+800,segments=34,start=.015,end=.99)\n\n",
              "primary bough mantle")

          replace_between(
              "                if side in (-1,1) and di in (0,2) and rng.random()<.70:",
              "                for f,frac in enumerate((.28,.72)):",
              "                if side in (-1,1) and di in (0,2) and rng.random()<.34:\n"
              "                    snow.add_snow_ribbon([fork_root,fm,ft],.014,.0085,.016,\n"
              "                        seed+2700+j*19+di*11,segments=10,start=.14,end=.96)\n",
              "bough forklet snow")

          replace_between(
              "    # Several individually tapered snow mantles track the curvature of the",
              "    parts={'wood':wood.to_mesh(),'snow':snow.to_mesh()}",
              "    # A single connected snow mantle follows the full main bough.\n"
              "    # The irregular feathered margins leave needles visible at the sides.\n"
              "    snow.add_snow_ribbon(pts,.066,.039,.064,seed+800,\n"
              "                         segments=36,start=.015,end=.99)\n",
              "close-up bough mantle")

          note_start = "    stats['notes']=" 
          note_end = "\n"
          i = s.index(note_start)
          j = s.index(note_end, i)
          s = s[:i] + "    stats['notes']="+repr(
              "V52 natural-snow pass: preserves the approved V47 branch silhouette and individual-needle detail, but replaces repeated short snow caps with longer, connected, feather-edged mantles following primary boughs and secondary fans. Smaller tertiary deposits are less frequent and thinner, with broader low-frequency edge drift and a smoother rounded cross-section. Subtle lower-bough sag, needle hue variation, and the Blender PBR material pass are retained. No detached snow blobs are emitted."
          ) + s[j:]

          if "intervals=[(.025,.135)" in s or "twig_caps=((.10,.42)" in s or "fan_caps=((.12,.43)" in s:
              raise SystemExit("Old segmented snow-cap logic remains; refusing to build.")

          compile(s, str(path), "exec")
          path.write_text(s, encoding="utf-8")
          print("Natural snow patch applied; source syntax check passed.")
          PY

      - name: Rebuild V47 and V52 geometry
        shell: bash
        run: |
          set -euo pipefail
          python -u render-v52-source/base/build_hero_spruce_v47.py | tee v47-build.log
          WINTERWORLD_V47_BASE="$GITHUB_WORKSPACE/render-v52-source/base" \
            python -u render-v52-source/v52/build_hero_spruce_v52.py | tee v52-build.log

      - name: Download official Blender 5.2.3 LTS
        shell: bash
        run: |
          set -euo pipefail
          URL="https://download.blender.org/release/Blender5.2"
          curl --fail --location --retry 4 --retry-delay 3 \
            "$URL/blender-5.2.3-linux-x64.tar.xz" \
            --output "$RUNNER_TEMP/blender-5.2.3-linux-x64.tar.xz"
          curl --fail --location --retry 4 --retry-delay 3 \
            "$URL/blender-5.2.3.sha256" \
            --output "$RUNNER_TEMP/blender-5.2.3.sha256"
          grep "blender-5.2.3-linux-x64.tar.xz" "$RUNNER_TEMP/blender-5.2.3.sha256" \
            | sed "s|  blender-5.2.3-linux-x64.tar.xz|  $RUNNER_TEMP/blender-5.2.3-linux-x64.tar.xz|" \
            | sha256sum --check -
          tar -xJf "$RUNNER_TEMP/blender-5.2.3-linux-x64.tar.xz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/blender-5.2.3-linux-x64/blender" --version

      - name: Render naturalized snow with Cycles CPU
        working-directory: render-v52-source/v52
        shell: bash
        run: |
          set -o pipefail
          "$RUNNER_TEMP/blender-5.2.3-linux-x64/blender" \
            --background --factory-startup \
            --python render_cycles_v52.py \
            --python-exit-code 1 2>&1 | tee "$GITHUB_WORKSPACE/cycles-render.log"

      - name: Save revised source ZIP back to render branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -f render-v52-source.zip
          zip -qr render-v52-source.zip render-v52-source/base/build_hero_spruce_v47.py \
            render-v52-source/v52/build_hero_spruce_v52.py \
            render-v52-source/v52/render_cycles_v52.py \
            render-v52-source/README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add render-v52-source.zip
          git commit -m "Naturalize V52 branch snow mantles"
          git push origin HEAD:render-v52-cycles

      - name: Upload naturalized Cycles renders and revised assets
        uses: actions/upload-artifact@v4
        with:
          name: WinterWorld-V52-Natural-Snow-Cycles
          path: |
            render-v52-source/v52/cycles_renders/
            render-v52-source/v52/Hero_Spruce_V52_Cycles.blend
            render-v52-source/v52/Hero_Spruce_V52_GameLOD.glb
            render-v52-source/v52/Hero_Spruce_V52_Bough.glb
            render-v52-source/v52/Hero_Spruce_V52_Stats.json
            cycles-render.log
            v47-build.log
            v52-build.log
            render-v52-source.zip
          if-no-files-found: error
          retention-days: 14
