name: Publish Winter World Development Build 019 Release

on:
  workflow_run:
    workflows:
      - Build Winter World 019 with distance-based V52 LODs
    types:
      - completed

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download the successful Build 019 artifact
        uses: actions/download-artifact@v4
        with:
          name: WinterWorld-Build019-V52-DistanceLOD
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: artifacts

      - name: Prepare release assets and verify package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          find_one() {
            local name="$1"
            local found
            found="$(find artifacts -type f -name "$name" -print -quit)"
            if [[ -z "$found" || ! -s "$found" ]]; then
              echo "::error::Required Build 019 release asset is missing: $name"
              exit 1
            fi
            cp "$found" "release-assets/$name"
          }

          find_one "WinterWorld_Playtest_Build019_V52_DistanceLOD.zip"
          find_one "hero_spruce_v52_stats.json"
          find_one "BUILD_019_CHANGELOG.md"
          find_one "BUILD_019_TEST_REPORT.md"
          find_one "BUILD_019_TEST_REPORT.json"
          find_one "V52_Build019_Hero_Medium_Far_LODs.png"
          find_one "V52_Cycles_FullTree_ZUp_Framed_40mm.png"
          find_one "V52_Cycles_Bough_SnowContact_Closeup.png"

          unzip -tq release-assets/WinterWorld_Playtest_Build019_V52_DistanceLOD.zip
          ls -lh release-assets/

      - name: Publish the numbered GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="winter-world-build-019-v52-distance-lods"
          TITLE="Winter World Development Build 019 — Distance-Based V52 LODs"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "$TITLE" \
              --notes-file release-assets/BUILD_019_CHANGELOG.md \
              --target "$TARGET"
          fi
